name: Build ebook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install tectonic 0.15.0
        run: |
          curl -L -o tectonic.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz
          tar xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Build PDF and EPUB
        run: ./scripts/build-ebook.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: the-last-application
          path: |
            dist/the-last-application.pdf
            dist/the-last-application.epub
